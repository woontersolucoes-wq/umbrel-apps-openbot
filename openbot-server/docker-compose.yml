version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: openbot-server_status_1
      APP_PORT: 8080
    container_name: openbot-server_app_proxy_1

  # Página de status aberta pelo ícone. Só leitura, sem privilégios.
  status:
    image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: on-failure
    user: "65534:65534"
    read_only: true
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - ${APP_DATA_DIR}/www/index.html:/www/index.html:ro
      - ${APP_DATA_DIR}/data/status:/www/status:ro
    container_name: openbot-server_status_1

  # Trava de segurança. O umbrelOS ignora erros de hook, então o servidor só
  # sobe se o hooks/pre-start terminou e aplicou o firewall neste boot.
  guard:
    image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: "no"
    user: "65534:65534"
    read_only: true
    network_mode: none
    command:
      - sh
      - -c
      - >-
        if [ "$$(cat /status/firewall-ok 2>/dev/null)" = "$$(cat /proc/sys/kernel/random/boot_id)" ];
        then echo "Firewall confirmado."; exit 0;
        else echo "Firewall ausente. O OpenBot não vai iniciar. Veja a página de status."; exit 1; fi
    volumes:
      - ${APP_DATA_DIR}/data/status:/status:ro
    container_name: openbot-server_guard_1

  # Servidor oficial do OpenBot. Mesmas opções do compose.yaml oficial,
  # mais limites de recursos e uma rede isolada (ver hooks/pre-start).
  server:
    image: ghcr.io/nightly-labs/openbot:v0.69.0@sha256:a84be4b5bf7aa0aaf85486b5b6970f41b9051e5294f298163507efe6604d522d
    depends_on:
      guard:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 60s
    shm_size: 1g
    mem_limit: 6g
    cpus: 4
    pids_limit: 4096
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 9.9.9.9
    volumes:
      - ${APP_DATA_DIR}/data/openbot:/data
    networks:
      - isolated
    container_name: openbot-server_server_1

networks:
  isolated:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-openbot
